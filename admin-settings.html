<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Ayarları | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-shell">

<header class="admin-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;">
      <a href="admin.html" class="logo">
        <span class="mark">G</span>
        <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
      </a>
      <span class="admin-badge">Yönetici Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="adminNameLabel" style="font-size:13px;color:var(--muted);font-weight:600;"></span>
      <a href="index.html" class="filter-btn">Mağazayı Görüntüle</a>
      <button class="filter-btn" id="adminLogoutBtn"><span data-lucide="log-out" style="width:14px;height:14px;"></span> Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-content" style="max-width:640px;">
    <h1 class="page-title" style="margin-top:0;">Site Ayarları</h1>
    <p class="page-sub">Bu ayarlar mağaza genelinde (kargo eşiği, ücreti vb.) gerçekten kullanılır ve localStorage'da saklanır.</p>

    <form id="settingsForm">
      <div class="checkout-card">
        <h3><span data-lucide="settings"></span> Genel</h3>
        <div class="form-field full">
          <label for="siteName">Site Adı</label>
          <input type="text" id="siteName">
        </div>
        <div class="form-grid">
          <div class="form-field">
            <label for="contactEmail">İletişim E-postası</label>
            <input type="email" id="contactEmail">
          </div>
          <div class="form-field">
            <label for="contactPhone">İletişim Telefonu</label>
            <input type="text" id="contactPhone">
          </div>
          <div class="form-field">
            <label for="currency">Para Birimi Simgesi</label>
            <input type="text" id="currency" maxlength="6">
          </div>
        </div>
      </div>

      <div class="checkout-card">
        <h3><span data-lucide="truck"></span> Kargo</h3>
        <div class="form-grid">
          <div class="form-field">
            <label for="freeShippingThreshold">Ücretsiz Kargo Eşiği (TL)</label>
            <input type="number" id="freeShippingThreshold" min="0" step="1">
          </div>
          <div class="form-field">
            <label for="shippingFee">Standart Kargo Ücreti (TL)</label>
            <input type="number" id="shippingFee" min="0" step="0.01">
          </div>
        </div>
      </div>

      <div class="checkout-card">
        <h3><span data-lucide="shield-check"></span> Bakım Modu</h3>
        <label style="display:flex;align-items:center;gap:12px;cursor:pointer;">
          <span class="toggle-switch">
            <input type="checkbox" id="maintenanceMode">
            <span class="track"></span>
          </span>
          <span style="font-size:13px;">Bakım modunu etkinleştir (mağazada uyarı şeridi gösterir)</span>
        </label>
      </div>

      <div id="saveNote" style="font-size:12.5px;color:#2ed3a3;margin-bottom:12px;height:16px;"></div>
      <button type="submit" class="btn-orange" style="width:100%;justify-content:center;">Ayarları Kaydet</button>
    </form>
  </main>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script src="assets/js/site-settings.js"></script>
<script src="assets/js/admin-ui.js"></script>
<script>
  const adminSession = GD.requireAdmin();
  if(adminSession){
    lucide.createIcons();
    GD.renderAdminSidebar('settings');
    GD.renderAdminHeader(adminSession);

    const settings = GD.getSettings();
    document.getElementById('siteName').value = settings.siteName;
    document.getElementById('contactEmail').value = settings.contactEmail;
    document.getElementById('contactPhone').value = settings.contactPhone;
    document.getElementById('currency').value = settings.currency;
    document.getElementById('freeShippingThreshold').value = settings.freeShippingThreshold;
    document.getElementById('shippingFee').value = settings.shippingFee;
    document.getElementById('maintenanceMode').checked = !!settings.maintenanceMode;

    document.getElementById('settingsForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      GD.saveSettings({
        siteName: document.getElementById('siteName').value.trim() || 'gadgetdünyası',
        contactEmail: document.getElementById('contactEmail').value.trim(),
        contactPhone: document.getElementById('contactPhone').value.trim(),
        currency: document.getElementById('currency').value.trim() || 'TL',
        freeShippingThreshold: Number(document.getElementById('freeShippingThreshold').value) || 0,
        shippingFee: Number(document.getElementById('shippingFee').value) || 0,
        maintenanceMode: document.getElementById('maintenanceMode').checked
      });
      const note = document.getElementById('saveNote');
      note.textContent = 'Ayarlar kaydedildi.';
      setTimeout(()=> note.textContent = '', 2500);
    });
  }
</script>
</body>
</html>
