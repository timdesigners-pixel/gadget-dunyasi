<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kullanıcı Yönetimi | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-shell">

<header class="admin-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;">
      <a href="admin.html" class="logo">
        <span class="mark">G</span>
        <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
      </a>
      <span class="admin-badge">Yönetici Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="adminNameLabel" style="font-size:13px;color:var(--muted);font-weight:600;"></span>
      <a href="index.html" class="filter-btn">Mağazayı Görüntüle</a>
      <button class="filter-btn" id="adminLogoutBtn"><span data-lucide="log-out" style="width:14px;height:14px;"></span> Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-content">
    <div class="admin-toolbar">
      <div>
        <h1 class="page-title" style="margin:0;">Kullanıcı Yönetimi</h1>
        <p class="page-sub" style="margin:4px 0 0;">Kayıtlı müşteri hesaplarını görüntüle, engelle veya sil.</p>
      </div>
      <button class="btn-orange" id="addUserBtn">
        <span data-lucide="plus" style="width:15px;height:15px;"></span> Kullanıcı Ekle
      </button>
    </div>

    <div class="admin-section">
      <input type="text" class="search-box" id="userSearch" placeholder="İsim veya e-posta ara...">
      <div style="overflow-x:auto;margin-top:16px;">
        <table class="admin-table">
          <thead>
            <tr><th>Ad Soyad</th><th>E-posta</th><th>Kayıt Yöntemi</th><th>Durum</th><th></th></tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
      <div class="admin-empty" id="usersEmpty" style="display:none;">Kullanıcı bulunamadı.</div>
    </div>
  </main>
</div>

<!-- Kullanıcı ekle/düzenle modalı -->
<div class="admin-modal-overlay" id="userModal">
  <div class="admin-modal">
    <button class="admin-modal-close" id="userModalClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 id="userModalTitle">Kullanıcı Ekle</h3>
    <form id="userForm">
      <input type="hidden" id="userOrigEmail">
      <div class="form-field full">
        <label for="userName">Ad Soyad</label>
        <input type="text" id="userName">
        <div class="err-msg" id="err-userName"></div>
      </div>
      <div class="form-field full">
        <label for="userEmail">E-posta</label>
        <input type="email" id="userEmail">
        <div class="err-msg" id="err-userEmail"></div>
      </div>
      <div class="form-field full" id="userPasswordField">
        <label for="userPassword">Şifre</label>
        <input type="text" id="userPassword" placeholder="En az 6 karakter">
        <div class="err-msg" id="err-userPassword"></div>
      </div>
      <button type="submit" class="btn-orange" style="width:100%;justify-content:center;">Kaydet</button>
    </form>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script src="assets/js/site-settings.js"></script>
<script src="assets/js/admin-ui.js"></script>
<script>
  const adminSession = GD.requireAdmin();
  if(adminSession){
    lucide.createIcons();
    GD.renderAdminSidebar('users');
    GD.renderAdminHeader(adminSession);

    const usersTableBody = document.getElementById('usersTableBody');
    const usersEmpty = document.getElementById('usersEmpty');
    const userSearch = document.getElementById('userSearch');
    const userModal = document.getElementById('userModal');
    const userForm = document.getElementById('userForm');
    let editingEmail = null;

    function renderUsers(){
      const q = userSearch.value.trim().toLowerCase();
      let users = GD.getUsers();
      if(q){
        users = users.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
      }
      usersEmpty.style.display = users.length === 0 ? 'block' : 'none';
      usersTableBody.innerHTML = users.map(u=>`
        <tr>
          <td>${GD.escapeHtml(u.name)}</td>
          <td>${GD.escapeHtml(u.email)}</td>
          <td>${u.provider ? GD.escapeHtml(u.provider) : 'E-posta'}</td>
          <td>${u.status === 'blocked' ? 'Engelli' : 'Aktif'}</td>
          <td>
            <div class="row-actions">
              <button class="btn-sm" data-action="edit" data-email="${GD.escapeHtml(u.email)}">Düzenle</button>
              <button class="btn-sm" data-action="toggle" data-email="${GD.escapeHtml(u.email)}">${u.status === 'blocked' ? 'Engeli Kaldır' : 'Engelle'}</button>
              <button class="btn-sm danger" data-action="delete" data-email="${GD.escapeHtml(u.email)}">Sil</button>
            </div>
          </td>
        </tr>`).join('');

      usersTableBody.querySelectorAll('[data-action="edit"]').forEach(btn=>{
        btn.addEventListener('click', ()=> openEdit(btn.dataset.email));
      });
      usersTableBody.querySelectorAll('[data-action="toggle"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const user = GD.getUsers().find(u=>u.email===btn.dataset.email);
          GD.updateUser(btn.dataset.email, { status: user.status === 'blocked' ? 'active' : 'blocked' });
          renderUsers();
        });
      });
      usersTableBody.querySelectorAll('[data-action="delete"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(confirm('Bu kullanıcıyı silmek istediğinizden emin misiniz?')){
            GD.deleteUser(btn.dataset.email);
            renderUsers();
          }
        });
      });
    }

    function openAdd(){
      editingEmail = null;
      document.getElementById('userModalTitle').textContent = 'Kullanıcı Ekle';
      document.getElementById('userPasswordField').style.display = '';
      userForm.reset();
      userModal.classList.add('open');
    }
    function openEdit(email){
      const user = GD.getUsers().find(u=>u.email===email);
      if(!user) return;
      editingEmail = email;
      document.getElementById('userModalTitle').textContent = 'Kullanıcıyı Düzenle';
      document.getElementById('userPasswordField').style.display = 'none';
      document.getElementById('userName').value = user.name;
      document.getElementById('userEmail').value = user.email;
      userModal.classList.add('open');
    }
    document.getElementById('addUserBtn').addEventListener('click', openAdd);
    document.getElementById('userModalClose').addEventListener('click', ()=> userModal.classList.remove('open'));
    userModal.addEventListener('click', (e)=>{ if(e.target === userModal) userModal.classList.remove('open'); });

    userForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value;
      ['userName','userEmail','userPassword'].forEach(id => document.getElementById('err-'+id).textContent = '');
      if(!name){ document.getElementById('err-userName').textContent = 'Ad soyad gerekli.'; return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ document.getElementById('err-userEmail').textContent = 'Geçerli bir e-posta girin.'; return; }

      if(editingEmail){
        const result = GD.updateUser(editingEmail, { name, email });
        if(!result){ return; }
      } else {
        if(password.length < 6){ document.getElementById('err-userPassword').textContent = 'Şifre en az 6 karakter olmalı.'; return; }
        const result = GD.adminCreateUser({ name, email, password });
        if(!result.ok){ document.getElementById('err-userEmail').textContent = result.error; return; }
      }
      userModal.classList.remove('open');
      renderUsers();
    });

    userSearch.addEventListener('input', renderUsers);
    renderUsers();
  }
</script>
</body>
</html>
