<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Yöntemleri | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-shell">

<header class="admin-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;">
      <a href="admin.html" class="logo">
        <span class="mark">G</span>
        <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
      </a>
      <span class="admin-badge">Yönetici Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="adminNameLabel" style="font-size:13px;color:var(--muted);font-weight:600;"></span>
      <a href="index.html" class="filter-btn">Mağazayı Görüntüle</a>
      <button class="filter-btn" id="adminLogoutBtn"><span data-lucide="log-out" style="width:14px;height:14px;"></span> Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-content">
    <div class="admin-toolbar">
      <div>
        <h1 class="page-title" style="margin:0;">Ödeme Yöntemleri</h1>
        <p class="page-sub" style="margin:4px 0 0;">Etkinleştirdiğiniz yöntemler ödeme sayfasında müşterilere gösterilir.</p>
      </div>
      <button class="btn-orange" id="addMethodBtn">
        <span data-lucide="plus" style="width:15px;height:15px;"></span> Yöntem Ekle
      </button>
    </div>

    <div class="admin-section">
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr><th>Yöntem</th><th>Açıklama</th><th>Durum</th><th></th></tr>
          </thead>
          <tbody id="methodsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-section">
      <h3>Önizleme (Ödeme Sayfası)</h3>
      <div class="pay-options" id="previewOptions" style="max-width:420px;"></div>
    </div>
  </main>
</div>

<div class="admin-modal-overlay" id="methodModal">
  <div class="admin-modal">
    <button class="admin-modal-close" id="methodModalClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3>Ödeme Yöntemi Ekle</h3>
    <form id="methodForm">
      <div class="form-field full">
        <label for="mLabel">Yöntem Adı</label>
        <input type="text" id="mLabel" placeholder="örn. Banka Havalesi / EFT">
        <div class="err-msg" id="err-mLabel"></div>
      </div>
      <div class="form-field full">
        <label for="mSub">Açıklama</label>
        <input type="text" id="mSub" placeholder="örn. Sipariş onayından sonra IBAN gönderilir">
      </div>
      <button type="submit" class="btn-orange" style="width:100%;justify-content:center;">Kaydet</button>
    </form>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script src="assets/js/site-settings.js"></script>
<script src="assets/js/admin-ui.js"></script>
<script>
  const adminSession = GD.requireAdmin();
  if(adminSession){
    lucide.createIcons();
    GD.renderAdminSidebar('payments');
    GD.renderAdminHeader(adminSession);

    const methodsTableBody = document.getElementById('methodsTableBody');
    const previewOptions = document.getElementById('previewOptions');
    const methodModal = document.getElementById('methodModal');

    function renderMethods(){
      const methods = GD.getPaymentMethods();
      methodsTableBody.innerHTML = methods.map(m=>`
        <tr>
          <td>${GD.escapeHtml(m.label)}</td>
          <td>${GD.escapeHtml(m.sub || '')}</td>
          <td>
            <label class="toggle-switch">
              <input type="checkbox" data-key="${GD.escapeHtml(m.key)}" ${m.enabled ? 'checked' : ''}>
              <span class="track"></span>
            </label>
          </td>
          <td>
            <div class="row-actions">
              <button class="btn-sm danger" data-action="delete" data-key="${GD.escapeHtml(m.key)}">Sil</button>
            </div>
          </td>
        </tr>`).join('');

      methodsTableBody.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const methods = GD.getPaymentMethods();
          const method = methods.find(m=>m.key===cb.dataset.key);
          method.enabled = cb.checked;
          GD.savePaymentMethods(methods);
          renderPreview();
        });
      });
      methodsTableBody.querySelectorAll('[data-action="delete"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(confirm('Bu ödeme yöntemini silmek istediğinizden emin misiniz?')){
            GD.savePaymentMethods(GD.getPaymentMethods().filter(m=>m.key!==btn.dataset.key));
            renderMethods();
            renderPreview();
          }
        });
      });
    }

    function renderPreview(){
      const enabled = GD.getPaymentMethods().filter(m=>m.enabled);
      if(enabled.length === 0){
        previewOptions.innerHTML = `<div class="admin-empty">Aktif ödeme yöntemi yok.</div>`;
        return;
      }
      previewOptions.innerHTML = enabled.map((m,i)=>`
        <label class="pay-option${i===0?' active':''}">
          <input type="radio" name="previewMethod" ${i===0?'checked':''}>
          <span data-lucide="${m.icon}"></span>
          <div><div class="label">${GD.escapeHtml(m.label)}</div><div class="sub">${GD.escapeHtml(m.sub||'')}</div></div>
        </label>`).join('');
      GD.createIconsIn(previewOptions);
    }

    document.getElementById('addMethodBtn').addEventListener('click', ()=>{
      document.getElementById('methodForm').reset();
      methodModal.classList.add('open');
    });
    document.getElementById('methodModalClose').addEventListener('click', ()=> methodModal.classList.remove('open'));
    methodModal.addEventListener('click', (e)=>{ if(e.target===methodModal) methodModal.classList.remove('open'); });

    document.getElementById('methodForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const label = document.getElementById('mLabel').value.trim();
      const sub = document.getElementById('mSub').value.trim();
      document.getElementById('err-mLabel').textContent = '';
      if(!label){ document.getElementById('err-mLabel').textContent = 'Yöntem adı gerekli.'; return; }
      const methods = GD.getPaymentMethods();
      const key = 'custom-' + Date.now().toString(36);
      methods.push({ key, label, sub, icon:'credit-card', enabled:true });
      GD.savePaymentMethods(methods);
      methodModal.classList.remove('open');
      renderMethods();
      renderPreview();
    });

    renderMethods();
    renderPreview();
  }
</script>
</body>
</html>
