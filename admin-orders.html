<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Yönetimi | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-shell">

<header class="admin-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;">
      <a href="admin.html" class="logo">
        <span class="mark">G</span>
        <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
      </a>
      <span class="admin-badge">Yönetici Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="adminNameLabel" style="font-size:13px;color:var(--muted);font-weight:600;"></span>
      <a href="index.html" class="filter-btn">Mağazayı Görüntüle</a>
      <button class="filter-btn" id="adminLogoutBtn"><span data-lucide="log-out" style="width:14px;height:14px;"></span> Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-content">
    <h1 class="page-title" style="margin-top:0;">Sipariş Yönetimi</h1>
    <p class="page-sub">Sipariş durumunu güncelle, detaylarını incele.</p>

    <div class="admin-section">
      <div class="admin-toolbar" style="margin-bottom:0;">
        <input type="text" class="search-box" id="orderSearch" placeholder="Sipariş no veya müşteri ara...">
        <select class="select-field" id="statusFilter">
          <option value="">Tüm Durumlar</option>
          <option value="Onaylandı">Onaylandı</option>
          <option value="Hazırlanıyor">Hazırlanıyor</option>
          <option value="Kargoya Verildi">Kargoya Verildi</option>
          <option value="Teslim Edildi">Teslim Edildi</option>
          <option value="İptal Edildi">İptal Edildi</option>
        </select>
      </div>
      <div style="overflow-x:auto;margin-top:16px;">
        <table class="admin-table">
          <thead>
            <tr><th>Sipariş No</th><th>Tarih</th><th>Müşteri</th><th>Tutar</th><th>Durum</th><th></th></tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
      <div class="admin-empty" id="ordersEmpty" style="display:none;">Sipariş bulunamadı.</div>
    </div>
  </main>
</div>

<div class="admin-modal-overlay" id="orderModal">
  <div class="admin-modal" style="max-width:600px;">
    <button class="admin-modal-close" id="orderModalClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="orderDetailBody"></div>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script src="assets/js/site-settings.js"></script>
<script src="assets/js/admin-ui.js"></script>
<script>
  const adminSession = GD.requireAdmin();
  if(adminSession){
    lucide.createIcons();
    GD.renderAdminSidebar('orders');
    GD.renderAdminHeader(adminSession);

    const STATUSES = ['Onaylandı','Hazırlanıyor','Kargoya Verildi','Teslim Edildi','İptal Edildi'];
    const ordersTableBody = document.getElementById('ordersTableBody');
    const ordersEmpty = document.getElementById('ordersEmpty');
    const orderSearch = document.getElementById('orderSearch');
    const statusFilter = document.getElementById('statusFilter');
    const orderModal = document.getElementById('orderModal');

    function renderOrders(){
      const q = orderSearch.value.trim().toLowerCase();
      const statusQ = statusFilter.value;
      let orders = GD.getOrders();
      if(statusQ) orders = orders.filter(o => (o.status || 'Onaylandı') === statusQ);
      if(q){
        orders = orders.filter(o =>
          o.id.toLowerCase().includes(q) ||
          ((o.address && o.address.fullName) || '').toLowerCase().includes(q)
        );
      }
      ordersEmpty.style.display = orders.length === 0 ? 'block' : 'none';
      ordersTableBody.innerHTML = orders.map(o=>{
        const dateStr = new Date(o.date).toLocaleDateString('tr-TR', { day:'numeric', month:'short', year:'numeric' });
        return `
        <tr>
          <td>${GD.escapeHtml(o.id)}</td>
          <td>${dateStr}</td>
          <td>${GD.escapeHtml((o.address && o.address.fullName) || '—')}</td>
          <td>${GD.fmt(o.total)}</td>
          <td>
            <select class="select-field status-select" data-id="${o.id}" style="font-size:11.5px;padding:6px 9px;">
              ${STATUSES.map(s=>`<option value="${s}" ${s===(o.status||'Onaylandı')?'selected':''}>${s}</option>`).join('')}
            </select>
          </td>
          <td><button class="btn-sm" data-action="detail" data-id="${o.id}">Detay</button></td>
        </tr>`;
      }).join('');

      ordersTableBody.querySelectorAll('.status-select').forEach(sel=>{
        sel.addEventListener('change', ()=>{
          GD.updateOrder(sel.dataset.id, { status: sel.value });
        });
      });
      ordersTableBody.querySelectorAll('[data-action="detail"]').forEach(btn=>{
        btn.addEventListener('click', ()=> openDetail(btn.dataset.id));
      });
    }

    function openDetail(id){
      const o = GD.getOrder(id);
      if(!o) return;
      const dateStr = new Date(o.date).toLocaleString('tr-TR');
      document.getElementById('orderDetailBody').innerHTML = `
        <h3>Sipariş ${GD.escapeHtml(o.id)}</h3>
        <div class="summary-row"><span>Tarih</span><span>${dateStr}</span></div>
        <div class="summary-row"><span>Müşteri</span><span>${GD.escapeHtml((o.address && o.address.fullName) || '—')}</span></div>
        <div class="summary-row"><span>E-posta</span><span>${GD.escapeHtml((o.address && o.address.email) || '—')}</span></div>
        <div class="summary-row"><span>Telefon</span><span>${GD.escapeHtml((o.address && o.address.phone) || '—')}</span></div>
        <div class="summary-row"><span>Adres</span><span style="text-align:right;max-width:60%;">${GD.escapeHtml(o.address ? `${o.address.address}, ${o.address.city} ${o.address.zip}` : '—')}</span></div>
        <div class="summary-row"><span>Ödeme</span><span>${o.payment && o.payment.method === 'card' ? 'Kredi/Banka Kartı' : (o.payment ? o.payment.method : '—')}</span></div>
        ${o.trackingNumber ? `<div class="summary-row"><span>Kargo Takip No</span><span>${GD.escapeHtml(o.trackingNumber)} (${GD.escapeHtml(o.carrierName||'')})</span></div>` : ''}
        <div style="border-top:1px solid var(--line);margin:14px 0;"></div>
        ${o.items.map(i=>`<div class="summary-row"><span>${i.qty}x ${GD.escapeHtml(i.name)}</span><span>${GD.fmt(i.qty*i.price)}</span></div>`).join('')}
        <div class="summary-row"><span>Ara Toplam</span><span>${GD.fmt(o.subtotal)}</span></div>
        ${o.discount > 0 ? `<div class="summary-row discount"><span>İndirim</span><span>-${GD.fmt(o.discount)}</span></div>` : ''}
        <div class="summary-row"><span>Kargo</span><span>${o.shipping === 0 ? 'Ücretsiz' : GD.fmt(o.shipping)}</span></div>
        <div class="summary-row total"><span>Toplam</span><span>${GD.fmt(o.total)}</span></div>
      `;
      orderModal.classList.add('open');
    }
    document.getElementById('orderModalClose').addEventListener('click', ()=> orderModal.classList.remove('open'));
    orderModal.addEventListener('click', (e)=>{ if(e.target===orderModal) orderModal.classList.remove('open'); });

    orderSearch.addEventListener('input', renderOrders);
    statusFilter.addEventListener('change', renderOrders);
    renderOrders();
  }
</script>
</body>
</html>
