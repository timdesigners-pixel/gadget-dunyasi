<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetici Paneli | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-shell">

<header class="admin-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;">
      <a href="admin.html" class="logo">
        <span class="mark">G</span>
        <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
      </a>
      <span class="admin-badge">Yönetici Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="adminNameLabel" style="font-size:13px;color:var(--muted);font-weight:600;"></span>
      <a href="index.html" class="filter-btn">Mağazayı Görüntüle</a>
      <button class="filter-btn" id="adminLogoutBtn"><span data-lucide="log-out" style="width:14px;height:14px;"></span> Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="wrap" id="adminBody" style="padding-top:6px;padding-bottom:50px;"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script>
  const adminSession = GD.getAdminSession();
  if(!adminSession){
    window.location.replace('admin-login.html');
  } else {
    lucide.createIcons();
    document.getElementById('adminNameLabel').textContent = adminSession.name + ' · ' + adminSession.email;

    const orders = GD.getOrders();
    const users = GD.getUsers();
    const totalRevenue = orders.reduce((s,o)=>s+o.total, 0);

    const adminBody = document.getElementById('adminBody');
    adminBody.innerHTML = `
      <h1 class="page-title" style="margin-top:20px;">Genel Bakış</h1>
      <p class="page-sub">Bu panel yalnızca bu tarayıcının localStorage'ındaki demo verilerini gösterir; gerçek bir merkezi veritabanına bağlı değildir.</p>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Toplam Sipariş</div>
          <div class="value">${orders.length}</div>
        </div>
        <div class="stat-card">
          <div class="label">Toplam Ciro</div>
          <div class="value">${GD.fmt(totalRevenue)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Kayıtlı Kullanıcı</div>
          <div class="value">${users.length}</div>
        </div>
        <div class="stat-card">
          <div class="label">Ürün / Set Sayısı</div>
          <div class="value">${GD.PRODUCTS.length + GD.SETS.length}</div>
        </div>
      </div>

      <div class="admin-section">
        <h3>Son Siparişler</h3>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Sipariş No</th><th>Tarih</th><th>Müşteri</th><th>Ürünler</th><th>Tutar</th><th>Durum</th></tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
        <div class="admin-empty" id="ordersEmpty" style="display:none;">Henüz sipariş yok.</div>
      </div>

      <div class="admin-section">
        <h3>Kayıtlı Kullanıcılar</h3>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Ad Soyad</th><th>E-posta</th><th>Kayıt Yöntemi</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
        <div class="admin-empty" id="usersEmpty" style="display:none;">Henüz kayıtlı kullanıcı yok.</div>
      </div>

      <div class="admin-section">
        <h3>Ürün Kataloğu</h3>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Ürün</th><th>Kategori</th><th>Fiyat</th><th>Puan</th><th>Etiket</th></tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
      </div>
    `;

    const ordersBody = document.getElementById('ordersTableBody');
    if(orders.length === 0){
      document.getElementById('ordersEmpty').style.display = 'block';
    } else {
      ordersBody.innerHTML = orders.slice(0,20).map(o=>{
        const dateStr = new Date(o.date).toLocaleDateString('tr-TR', { day:'numeric', month:'short', year:'numeric' });
        const itemsSummary = o.items.map(i=>`${i.qty}x ${GD.escapeHtml(i.name)}`).join(', ');
        return `<tr>
          <td>${GD.escapeHtml(o.id)}</td>
          <td>${dateStr}</td>
          <td>${GD.escapeHtml((o.address && o.address.fullName) || '—')}</td>
          <td style="max-width:280px;">${itemsSummary}</td>
          <td>${GD.fmt(o.total)}</td>
          <td>${GD.escapeHtml(o.status || 'Onaylandı')}</td>
        </tr>`;
      }).join('');
    }

    const usersBody = document.getElementById('usersTableBody');
    if(users.length === 0){
      document.getElementById('usersEmpty').style.display = 'block';
    } else {
      usersBody.innerHTML = users.map(u=>`<tr>
        <td>${GD.escapeHtml(u.name)}</td>
        <td>${GD.escapeHtml(u.email)}</td>
        <td>${u.provider ? GD.escapeHtml(u.provider) : 'E-posta'}</td>
      </tr>`).join('');
    }

    document.getElementById('productsTableBody').innerHTML = GD.PRODUCTS.map(p=>`<tr>
      <td>${GD.escapeHtml(p.name)}</td>
      <td>${GD.getCategoryLabel(p.cat)}</td>
      <td>${GD.fmt(p.price)}</td>
      <td>${p.rating} (${p.reviews})</td>
      <td>${GD.BADGE_LABEL[p.badge] || '—'}</td>
    </tr>`).join('');

    document.getElementById('adminLogoutBtn').addEventListener('click', ()=>{
      GD.logoutAdmin();
      window.location.href = 'admin-login.html';
    });
  }
</script>
</body>
</html>
