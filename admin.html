<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetici Paneli | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-shell">

<header class="admin-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;">
      <a href="admin.html" class="logo">
        <span class="mark">G</span>
        <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
      </a>
      <span class="admin-badge">Yönetici Paneli</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="adminNameLabel" style="font-size:13px;color:var(--muted);font-weight:600;"></span>
      <a href="index.html" class="filter-btn">Mağazayı Görüntüle</a>
      <button class="filter-btn" id="adminLogoutBtn"><span data-lucide="log-out" style="width:14px;height:14px;"></span> Çıkış Yap</button>
    </div>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-content" id="adminContent"></main>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script src="assets/js/site-settings.js"></script>
<script src="assets/js/admin-ui.js"></script>
<script>
  const adminSession = GD.requireAdmin();
  if(adminSession){
    lucide.createIcons();
    GD.renderAdminSidebar('dashboard');
    GD.renderAdminHeader(adminSession);

    const orders = GD.getOrders();
    const users = GD.getUsers();
    const products = GD.getAllProducts();
    const totalRevenue = orders.reduce((s,o)=>s+o.total, 0);

    const adminContent = document.getElementById('adminContent');
    adminContent.innerHTML = `
      <h1 class="page-title" style="margin-top:0;">Genel Bakış</h1>
      <p class="page-sub">Bu panel yalnızca bu tarayıcının localStorage'ındaki demo verilerini gösterir; gerçek bir merkezi veritabanına bağlı değildir.</p>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Toplam Sipariş</div>
          <div class="value">${orders.length}</div>
        </div>
        <div class="stat-card">
          <div class="label">Toplam Ciro</div>
          <div class="value">${GD.fmt(totalRevenue)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Kayıtlı Kullanıcı</div>
          <div class="value">${users.length}</div>
        </div>
        <div class="stat-card">
          <div class="label">Ürün / Set Sayısı</div>
          <div class="value">${products.length + GD.SETS.length}</div>
        </div>
      </div>

      <div class="admin-section">
        <h3>Hızlı Erişim</h3>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <a href="admin-orders.html" class="btn-sm"><span data-lucide="inbox" style="width:14px;height:14px;"></span> Siparişleri Yönet</a>
          <a href="admin-products.html" class="btn-sm"><span data-lucide="package" style="width:14px;height:14px;"></span> Ürün Ekle / Düzenle</a>
          <a href="admin-users.html" class="btn-sm"><span data-lucide="user" style="width:14px;height:14px;"></span> Kullanıcıları Yönet</a>
          <a href="admin-categories.html" class="btn-sm"><span data-lucide="folder" style="width:14px;height:14px;"></span> Kategorileri Düzenle</a>
          <a href="admin-tags.html" class="btn-sm"><span data-lucide="tag" style="width:14px;height:14px;"></span> Etiketleri Düzenle</a>
          <a href="admin-shipping.html" class="btn-sm"><span data-lucide="truck" style="width:14px;height:14px;"></span> Kargo Entegrasyonu</a>
          <a href="admin-payments.html" class="btn-sm"><span data-lucide="credit-card" style="width:14px;height:14px;"></span> Ödeme Yöntemleri</a>
          <a href="admin-accounting.html" class="btn-sm"><span data-lucide="bar-chart" style="width:14px;height:14px;"></span> Muhasebe Raporları</a>
          <a href="admin-settings.html" class="btn-sm"><span data-lucide="settings" style="width:14px;height:14px;"></span> Site Ayarları</a>
        </div>
      </div>

      <div class="admin-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="margin:0;">Son Siparişler</h3>
          <a href="admin-orders.html" class="btn-sm">Tümünü Gör</a>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Sipariş No</th><th>Tarih</th><th>Müşteri</th><th>Ürünler</th><th>Tutar</th><th>Durum</th></tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
        <div class="admin-empty" id="ordersEmpty" style="display:none;">Henüz sipariş yok.</div>
      </div>

      <div class="admin-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="margin:0;">Son Kayıtlı Kullanıcılar</h3>
          <a href="admin-users.html" class="btn-sm">Tümünü Gör</a>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Ad Soyad</th><th>E-posta</th><th>Kayıt Yöntemi</th><th>Durum</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
        <div class="admin-empty" id="usersEmpty" style="display:none;">Henüz kayıtlı kullanıcı yok.</div>
      </div>
    `;

    const ordersBody = document.getElementById('ordersTableBody');
    if(orders.length === 0){
      document.getElementById('ordersEmpty').style.display = 'block';
    } else {
      ordersBody.innerHTML = orders.slice(0,8).map(o=>{
        const dateStr = new Date(o.date).toLocaleDateString('tr-TR', { day:'numeric', month:'short', year:'numeric' });
        const itemsSummary = o.items.map(i=>`${i.qty}x ${GD.escapeHtml(i.name)}`).join(', ');
        return `<tr>
          <td>${GD.escapeHtml(o.id)}</td>
          <td>${dateStr}</td>
          <td>${GD.escapeHtml((o.address && o.address.fullName) || '—')}</td>
          <td style="max-width:280px;">${itemsSummary}</td>
          <td>${GD.fmt(o.total)}</td>
          <td>${GD.escapeHtml(o.status || 'Onaylandı')}</td>
        </tr>`;
      }).join('');
    }

    const usersBody = document.getElementById('usersTableBody');
    if(users.length === 0){
      document.getElementById('usersEmpty').style.display = 'block';
    } else {
      usersBody.innerHTML = users.slice(0,8).map(u=>`<tr>
        <td>${GD.escapeHtml(u.name)}</td>
        <td>${GD.escapeHtml(u.email)}</td>
        <td>${u.provider ? GD.escapeHtml(u.provider) : 'E-posta'}</td>
        <td>${u.status === 'blocked' ? 'Engelli' : 'Aktif'}</td>
      </tr>`).join('');
    }
  }
</script>
</body>
</html>
