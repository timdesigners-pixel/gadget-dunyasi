<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Onaylandı | gadgetdünyası</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="main">
  <div class="wrap header-row">
    <a href="index.html" class="logo">
      <span class="mark">G</span>
      <span>gadgetdünyası<small>ELEKTRONİK PAZARI</small></span>
    </a>
    <div style="flex:1;"></div>
    <div class="header-actions">
      <div class="cart-wrap">
        <div class="cart" id="cartToggle">
          <i data-lucide="shopping-cart" style="width:24px;height:24px;"></i>
          <span class="count" id="cartCount">0</span>
          <span class="label">Sepet</span>
        </div>
        <div class="cart-panel" id="cartPanel">
          <h4>Sepetim</h4>
          <div class="cart-items" id="cartItems"><div class="cart-empty">Sepetiniz henüz boş.</div></div>
          <div class="cart-footer">
            <div class="cart-total"><span>Toplam</span><span id="cartTotal">0 TL</span></div>
            <button class="btn-orange" id="cartGoBtn" style="width:100%;justify-content:center;">Sepete Git</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap success-wrap" id="successWrap"></div>

<footer style="margin-top:0;">
  <div class="wrap footer-bottom" style="border-top:none;margin-top:0;">
    <span>&copy; 2026 gadgetdünyası. Tüm hakları saklıdır.</span>
    <span>Gizlilik Politikası &nbsp;·&nbsp; Kullanım Şartları</span>
  </div>
</footer>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/orders.js"></script>
<script src="assets/js/site-settings.js"></script>
<script>
  lucide.createIcons();

  const params = new URLSearchParams(window.location.search);
  const order = GD.getOrder(params.get('order'));
  const wrap = document.getElementById('successWrap');

  if(!order){
    wrap.innerHTML = `
      <div class="success-icon" style="background:rgba(255,91,107,.14);">
        <span data-lucide="x" style="width:34px;height:34px;color:#ff5b6b;"></span>
      </div>
      <h1>Sipariş bulunamadı</h1>
      <p>Bu sipariş bağlantısı geçersiz görünüyor.</p>
      <div class="success-actions">
        <a href="index.html" class="btn-orange">Ana Sayfaya Dön</a>
      </div>`;
  } else {
    const dateStr = new Date(order.date).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
    wrap.innerHTML = `
      <div class="success-icon">
        <span data-lucide="check-circle"></span>
      </div>
      <h1>Siparişiniz Alındı!</h1>
      <p>Teşekkürler ${order.address.fullName.split(' ')[0]}, siparişiniz başarıyla oluşturuldu. Onay e-postası ${order.address.email} adresine gönderildi.</p>
      <div class="order-id-badge">Sipariş No: ${order.id}</div>

      <div class="success-summary">
        <div class="summary-row"><span>Sipariş Tarihi</span><span>${dateStr}</span></div>
        <div class="summary-row"><span>Teslimat Adresi</span><span style="text-align:right;max-width:60%;">${order.address.address}, ${order.address.city} ${order.address.zip}</span></div>
        <div class="summary-row"><span>Ödeme Yöntemi</span><span>${order.payment.method === 'card' ? 'Kredi/Banka Kartı ****' + (order.payment.cardLast4 || '') : 'Kapıda Ödeme'}</span></div>
        <div style="border-top:1px solid var(--line);margin:14px 0;"></div>
        ${order.items.map(i=>`<div class="summary-row"><span>${i.qty}x ${i.name}</span><span>${GD.fmt(i.qty*i.price)}</span></div>`).join('')}
        <div class="summary-row"><span>Ara Toplam</span><span>${GD.fmt(order.subtotal)}</span></div>
        ${order.discount > 0 ? `<div class="summary-row discount"><span>İndirim${order.coupon ? ' ('+order.coupon+')' : ''}</span><span>-${GD.fmt(order.discount)}</span></div>` : ''}
        <div class="summary-row"><span>Kargo</span><span>${order.shipping === 0 ? 'Ücretsiz' : GD.fmt(order.shipping)}</span></div>
        <div class="summary-row total"><span>Toplam</span><span>${GD.fmt(order.total)}</span></div>
      </div>

      <div class="success-actions">
        <a href="index.html" class="btn-ghost">Alışverişe Devam Et</a>
        <a href="account.html?tab=orders" class="btn-orange">Siparişlerimi Gör</a>
      </div>`;
  }
  GD.createIconsIn(wrap);
  GD.initHeaderCart();
</script>
</body>
</html>
